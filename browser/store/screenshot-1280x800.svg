<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#eef2f7"/>

  <g transform="translate(64 48)">
    <rect width="52" height="52" rx="12" fill="#182033"/>
    <path d="M13 17 23 26 13 35" fill="none" stroke="#f7f9fc"
          stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
    <path d="M28 34h12" fill="none" stroke="#50c878"
          stroke-linecap="round" stroke-width="5"/>
    <text x="68" y="36" fill="#182033" font-family="Arial, sans-serif"
          font-size="28" font-weight="700">cfx</text>
  </g>
  <rect x="1002" y="56" width="214" height="40" rx="20" fill="#dce6f5"/>
  <text x="1109" y="82" text-anchor="middle" fill="#33415c"
        font-family="Arial, sans-serif" font-size="17" font-weight="700">Chrome connector</text>

  <text x="64" y="156" fill="#182033" font-family="Arial, sans-serif"
        font-size="44" font-weight="700">From problem to submission in two commands.</text>
  <text x="64" y="199" fill="#59657a" font-family="Arial, sans-serif" font-size="23">
    The connector securely joins the local C++ workbench to your signed-in Codeforces tab.
  </text>

  <rect x="64" y="242" width="1152" height="500" rx="18" fill="#111827"/>
  <rect x="64" y="242" width="1152" height="58" rx="18" fill="#182033"/>
  <rect x="64" y="282" width="1152" height="18" fill="#182033"/>
  <circle cx="96" cy="271" r="7" fill="#f06a6a"/>
  <circle cx="120" cy="271" r="7" fill="#f3c969"/>
  <circle cx="144" cy="271" r="7" fill="#50c878"/>
  <text x="640" y="278" text-anchor="middle" fill="#b8c1d1"
        font-family="Menlo, Consolas, monospace" font-size="16">problems/cf/71/A</text>

  <g font-family="Menlo, Consolas, monospace" font-size="21">
    <text x="104" y="349" fill="#50c878">$ <tspan fill="#f7f9fc">cfx 71A</tspan></text>
    <text x="104" y="389" fill="#cbd5e1">Fetched 71A — Way Too Long Words</text>
    <text x="104" y="425" fill="#cbd5e1">Imported 2 samples</text>
    <text x="104" y="461" fill="#cbd5e1">Opened problems/cf/71/A/solution.cpp</text>

    <path d="M104 500h1072" stroke="#2b364a" stroke-width="2"/>

    <text x="104" y="551" fill="#50c878">$ <tspan fill="#f7f9fc">cfx submit</tspan></text>
    <text x="104" y="591" fill="#cbd5e1">2/2 tests passed</text>
    <text x="104" y="627" fill="#cbd5e1">Checked build passed</text>
    <text x="104" y="663" fill="#cbd5e1">Submitted 71A as GNU C++20</text>
  </g>

  <rect x="827" y="539" width="329" height="86" rx="14" fill="#1d293d"/>
  <circle cx="860" cy="570" r="13" fill="#50c878"/>
  <path d="m853 570 5 5 10-11" fill="none" stroke="#111827"
        stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <text x="885" y="568" fill="#f7f9fc" font-family="Arial, sans-serif"
        font-size="17" font-weight="700">Exact tested source</text>
  <text x="885" y="594" fill="#aeb8ca" font-family="Arial, sans-serif" font-size="15">
    Bundled, pinned, then submitted
  </text>
</svg>
