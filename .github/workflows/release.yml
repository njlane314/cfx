name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Validate and test
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ $GITHUB_REF_NAME == v"$version" ]]
          [[ $version =~ ^[0-9]+([.][0-9]+){2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          manifest_version=$(node -p \
            'JSON.parse(require("node:fs").readFileSync("src/browser/manifest.json", "utf8")).version')
          [[ $manifest_version == "$version" ]]
          make verify

  binaries:
    needs: verify
    name: ${{ matrix.platform }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux, architecture: x86_64}
          - {runner: ubuntu-24.04-arm, platform: linux, architecture: arm64}
          - {runner: macos-15-intel, platform: macos, architecture: x86_64}
          - {runner: macos-15, platform: macos, architecture: arm64}
    steps:
      - uses: actions/checkout@v7
      - name: Build, package, and smoke-test
        shell: bash
        run: |
          make build
          archive=$(release/package.sh "${GITHUB_REF_NAME#v}" \
            "${{ matrix.platform }}" "${{ matrix.architecture }}")
          package=${archive##*/}
          package=${package%.tar.gz}
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          tar -xzf "$archive" -C "$stage"
          "$stage/$package/bin/cfx" --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.architecture }}
          path: .build/release/*.tar.gz
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: .build/release
          merge-multiple: true
      - name: Add connector and checksums
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          connector=$(src/browser/package.sh)
          cp "$connector" .build/release/
          cd .build/release
          expected=(
            "cfx-$version-linux-arm64.tar.gz"
            "cfx-$version-linux-x86_64.tar.gz"
            "cfx-$version-macos-arm64.tar.gz"
            "cfx-$version-macos-x86_64.tar.gz"
            "cfx-connector-$version.zip"
          )
          for archive in "${expected[@]}"; do [[ -f $archive ]]; done
          sha256sum "${expected[@]}" | LC_ALL=C sort -k2 >SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" .build/release/* \
            --verify-tag --generate-notes \
            --title "cfx ${GITHUB_REF_NAME#v}" \
            --notes "The small, auditable, two-command Codeforces workflow."
